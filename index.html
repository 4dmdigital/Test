<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentación Virtual</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 🟢 PALETA DE COLORES VERDES 🟢 */
    :root {
      --bg-color: #06140d;         /* Fondo principal verde oscuro profundo */
      --card-bg: #0d2218;        /* Fondo de la tarjeta verde bosque nocturno */
      --text-main: #f0fdf4;       /* Texto principal blanco verdoso suave */
      --text-muted: #86efac;      /* Texto secundario verde menta claro */
      --accent-color: #10b981;    /* Verde esmeralda brillante para botón e interactivos */
      --accent-hover: #059669;    /* Verde esmeralda oscuro al pasar el cursor */
      --whatsapp-color: #25d366;  /* Verde oficial de WhatsApp */
      --border-color: #164e33;    /* Bordes sutiles verde pino */
      --hover-bg: #143827;        /* Fondo al pasar cursor por los enlaces */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px auto;
      border: 3px solid var(--accent-color);
      display: block;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .title {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .bio {
      font-size: 0.875rem;
      color: #bbf7d0;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .btn-save {
      width: 100%;
      background-color: var(--accent-color);
      color: #06140d; /* Texto oscuro para alto contraste sobre verde */
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-save:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-save:active {
      transform: scale(0.98);
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background-color: var(--hover-bg);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .link-item i {
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
      color: var(--accent-color);
    }

    .link-item.whatsapp i {
      color: var(--whatsapp-color);
    }

    .social-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .social-icon:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #06140d;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Foto de Perfil -->
    <img src="https://via.placeholder.com/150" alt="Foto de perfil" class="profile-img" id="user-img">

    <!-- Información Personal -->
    <h1 class="name" id="user-name">Daniel Alejandro Resendiz</h1>
    <p class="title" id="user-title">Puesto o Especialidad</p>
    <p class="bio" id="user-bio">Empresa o breve descripción de tus servicios principales y propuesta de valor.</p>

    <!-- Botón Principal: Guardar Contacto -->
    <button class="btn-save" id="btn-add-contact">
      <i class="fa-solid fa-user-plus"></i>
      Guardar Contacto
    </button>

    <!-- Enlaces Directos -->
    <div class="links-container">
      <a href="https://wa.me/5210000000000" target="_blank" class="link-item whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>Enviar WhatsApp</span>
      </a>
      <a href="mailto:correo@ejemplo.com" class="link-item">
        <i class="fa-regular fa-envelope"></i>
        <span>Enviar Correo</span>
      </a>
      <a href="tel:+5210000000000" class="link-item">
        <i class="fa-solid fa-phone"></i>
        <span>Llamar por Teléfono</span>
      </a>
      <a href="https://misitio.com" target="_blank" class="link-item">
        <i class="fa-solid fa-globe"></i>
        <span>Sitio Web / Portafolio</span>
      </a>
    </div>

    <!-- Iconos de Redes Sociales -->
    <div class="social-grid">
      <a href="#" target="_blank" class="social-icon" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="#" target="_blank" class="social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" target="_blank" class="social-icon" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" target="_blank" class="social-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>
    </div>
  </main>

  <script>
    // Configuración de Datos de Contacto
    const userData = {
      name: "Juan Pérez",
      title: "Consultor de Marketing Digital",
      org: "Mi Empresa",
      phone: "+5210000000000",
      email: "correo@ejemplo.com",
      url: "https://misitio.com"
    };

    // Generador y Descargador de Archivo vCard (.vcf)
    document.getElementById('btn-add-contact').addEventListener('click', function () {
      const vCardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${userData.name}`,
        `TITLE:${userData.title}`,
        `ORG:${userData.org}`,
        `TEL;TYPE=CELL:${userData.phone}`,
        `EMAIL:${userData.email}`,
        `URL:${userData.url}`,
        'END:VCARD'
      ].join('\n');

      const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${userData.name.replace(/\s+/g, '_')}.vcf`);
      document.body.appendChild(link);
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
